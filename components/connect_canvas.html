<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>街市接線遊戲</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif;
    background: #2A1810;
    color: #2B1A08;
    font-size: 28px;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  #game-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  #bg {
    position: absolute;
    inset: 0;
    background-color: #F5E6C8;
    background-image:
      radial-gradient(circle at 15% 25%, rgba(122, 31, 31, 0.08) 0%, transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(212, 160, 23, 0.12) 0%, transparent 50%),
      repeating-linear-gradient(88deg,
        rgba(90, 40, 20, 0.04) 0 2px,
        transparent 2px 8px,
        rgba(90, 40, 20, 0.02) 8px 12px,
        transparent 12px 25px);
    pointer-events: none;
  }

  #bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center,
      transparent 40%,
      rgba(90, 21, 21, 0.2) 100%);
    pointer-events: none;
  }

  #canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .coin {
    position: absolute;
    cursor: grab;
    user-select: none;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                filter 0.2s ease;
    z-index: 10;
    touch-action: none;
    filter:
      drop-shadow(0 6px 10px rgba(60, 30, 10, 0.4))
      drop-shadow(0 2px 3px rgba(60, 30, 10, 0.25));
    animation: coinDrop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }

  @keyframes coinDrop {
    0%   { opacity: 0; transform: scale(0.3) translateY(-40px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  .coin:hover {
    transform: scale(1.10) rotate(-2deg);
    filter:
      drop-shadow(0 10px 16px rgba(122, 31, 31, 0.55))
      drop-shadow(0 3px 5px rgba(60, 30, 10, 0.3));
  }

  .coin.dragging {
    cursor: grabbing;
    transform: scale(1.18) rotate(3deg);
    z-index: 100;
    filter:
      drop-shadow(0 16px 24px rgba(122, 31, 31, 0.6))
      drop-shadow(0 6px 10px rgba(60, 30, 10, 0.4));
  }

  .coin.connected {
    filter:
      drop-shadow(0 0 22px rgba(212, 160, 23, 0.95))
      drop-shadow(0 0 8px rgba(240, 201, 82, 0.8))
      drop-shadow(0 6px 10px rgba(60, 30, 10, 0.4));
  }

  .coin.highlight {
    filter:
      drop-shadow(0 0 26px rgba(212, 160, 23, 1))
      drop-shadow(0 0 12px rgba(240, 201, 82, 0.9))
      drop-shadow(0 10px 16px rgba(122, 31, 31, 0.5));
    transform: scale(1.15) rotate(0deg);
  }

  .coin svg {
    width: 100%; height: 100%;
    pointer-events: none;
  }

  #footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 22px 40px;
    background: linear-gradient(180deg,
      rgba(245, 230, 200, 0.94) 0%,
      rgba(232, 212, 168, 0.98) 100%);
    border-top: 5px solid #7A1F1F;
    box-shadow:
      0 -2px 0 #D4A017,
      0 -8px 24px rgba(90, 21, 21, 0.25);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    z-index: 200;
    flex-wrap: wrap;
  }

  #hint {
    font-size: 30px;
    font-weight: 700;
    color: #7A1F1F;
    flex: 1;
    letter-spacing: 0.5px;
    text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.5);
  }

  .btn {
    font-family: inherit;
    font-size: 28px;
    font-weight: 900;
    padding: 18px 40px;
    border: 4px solid #5A1515;
    border-radius: 14px;
    background: linear-gradient(180deg, #A83232 0%, #7A1F1F 100%);
    color: #F5E6C8;
    cursor: pointer;
    transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    min-width: 180px;
    letter-spacing: 1px;
    text-shadow: 1px 2px 0 rgba(0, 0, 0, 0.3);
    box-shadow:
      0 4px 0 #5A1515,
      0 6px 12px rgba(90, 21, 21, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
  }

  .btn:hover:not(:disabled) {
    background: linear-gradient(180deg, #F0C952 0%, #D4A017 100%);
    color: #2B1A08;
    border-color: #7A1F1F;
    transform: translateY(-3px);
    text-shadow: 1px 2px 0 rgba(255, 255, 255, 0.4);
    box-shadow:
      0 7px 0 #5A1515,
      0 9px 18px rgba(90, 21, 21, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }

  .btn:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow:
      0 2px 0 #5A1515,
      0 4px 8px rgba(90, 21, 21, 0.35);
  }

  .btn:disabled {
    background: linear-gradient(180deg, #C9B99A 0%, #A89878 100%);
    border-color: #8A7A58;
    color: #6A5A40;
    cursor: not-allowed;
    box-shadow:
      0 4px 0 #8A7A58,
      0 6px 12px rgba(90, 21, 21, 0.15);
  }

  .btn.secondary {
    background: linear-gradient(180deg, #F5E6C8 0%, #E8D4A8 100%);
    color: #7A1F1F;
    border-color: #7A1F1F;
    text-shadow: none;
    box-shadow:
      0 4px 0 #7A1F1F,
      0 6px 12px rgba(90, 21, 21, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }

  .btn.secondary:hover:not(:disabled) {
    background: linear-gradient(180deg, #A83232 0%, #7A1F1F 100%);
    color: #F5E6C8;
    transform: translateY(-3px);
    text-shadow: 1px 2px 0 rgba(0, 0, 0, 0.3);
  }

  .btn.secondary:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow:
      0 2px 0 #7A1F1F,
      0 4px 8px rgba(90, 21, 21, 0.3);
  }

  #done-panel {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: radial-gradient(ellipse at center,
      rgba(90, 21, 21, 0.8) 0%,
      rgba(42, 24, 16, 0.95) 100%);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999999;
    padding: 32px;
    backdrop-filter: blur(4px);
  }

  #done-panel.show {
    display: flex !important;
    animation: fadeIn 0.3s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  #done-card {
    background: linear-gradient(180deg, #F5E6C8 0%, #E8D4A8 100%);
    border: 6px solid #7A1F1F;
    border-radius: 24px;
    padding: 56px 64px;
    max-width: 720px;
    width: 100%;
    text-align: center;
    position: relative;
    box-shadow:
      0 0 0 8px #D4A017,
      0 0 0 12px #7A1F1F,
      0 30px 80px rgba(0, 0, 0, 0.6),
      inset 0 2px 0 rgba(255, 255, 255, 0.5);
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.7) translateY(20px); }
    60%  { opacity: 1; transform: scale(1.05) translateY(-5px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  #done-card::before,
  #done-card::after {
    content: "🏮";
    position: absolute;
    font-size: 52px;
    top: -36px;
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
  }
  #done-card::before { left: 24px; }
  #done-card::after  { right: 24px; }

  #done-card h2 {
    font-size: 64px;
    color: #7A1F1F;
    margin-bottom: 16px;
    letter-spacing: 2px;
    text-shadow:
      1px 2px 0 rgba(212, 160, 23, 0.6),
      2px 4px 8px rgba(90, 21, 21, 0.25);
    font-weight: 900;
  }

  #done-card p {
    font-size: 36px;
    color: #5A4030;
    margin-bottom: 40px;
    letter-spacing: 1px;
    font-weight: 600;
  }

  #done-card .btn {
    width: 100%;
    font-size: 32px;
  }
</style>
</head>
<body>

<div id="game-wrap">
  <div id="bg"></div>
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg"
       width="100%" height="100%">
    <g id="lines-layer"></g>
  </svg>
</div>

<div id="footer">
  <div id="hint">💡 由最細銀碼開始，逐個連埋佢啦！</div>
  <button class="btn secondary" id="undo-btn" disabled>↩️ 撤銷</button>
  <button class="btn" id="restart-btn">🔄 重新開始</button>
</div>

<div id="done-panel">
  <div id="done-card">
    <h2>🎉 完成啦！</h2>
    <p>阿婆好滿意！</p>
    <button class="btn" id="close-done">知道啦</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// 硬幣設定（真實香港硬幣色）
// ═══════════════════════════════════════════
const COINS = [
  { id: "10c", label: "一毫子", value: 0.10,
    c1: "#D4B584", c2: "#8B6F3A", c3: "#6A4F28", text: "10¢", textColor: "#2B1A08" },
  { id: "1d",  label: "一蚊",   value: 1.00,
    c1: "#F0D580", c2: "#B08F2E", c3: "#8A6F1E", text: "$1",  textColor: "#2B1A08" },
  { id: "20c", label: "兩毫子", value: 0.20,
    c1: "#D4B584", c2: "#8B6F3A", c3: "#6A4F28", text: "20¢", textColor: "#2B1A08" },
  { id: "2d",  label: "兩蚊",   value: 2.00,
    c1: "#F0D580", c2: "#B08F2E", c3: "#8A6F1E", text: "$2",  textColor: "#2B1A08" },
  { id: "50c", label: "五毫子", value: 0.50,
    c1: "#D4B584", c2: "#8B6F3A", c3: "#6A4F28", text: "50¢", textColor: "#2B1A08" },
  { id: "5d",  label: "五蚊",   value: 5.00,
    c1: "#E8E8E8", c2: "#9A9A9A", c3: "#6A6A6A", text: "$5",  textColor: "#1A1A1A" },
];

const CORRECT_SEQUENCE = ["10c", "1d", "20c", "2d", "50c", "5d"];
const COIN_SIZE = 130;
const FOOTER_H = 130;
const PADDING = 100;
const MIN_DIST = COIN_SIZE + 40;
const TARGET_CONNECTIONS = COINS.length - 1;
const MAX_PLACEMENT_TRIES = 500;

// ═══════════════════════════════════════════
// 狀態
// ═══════════════════════════════════════════
let state = {
  coins: [],
  connections: [],
  undoCount: 0,
  undoEvents: [],
  startTime: null,
  dragging: null,
  dragStart: null,
};

// ═══════════════════════════════════════════
// SVG 尺寸
// ═══════════════════════════════════════════
function resizeSvg() {
  const svg = document.getElementById('canvas');
  const w = window.innerWidth;
  const h = window.innerHeight;
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
}

// ═══════════════════════════════════════════
// 幾何
// ═══════════════════════════════════════════
function cross(o, a, b) {
  return (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
}

function segmentsIntersect(a, b, c, d) {
  const d1 = cross(c, d, a);
  const d2 = cross(c, d, b);
  const d3 = cross(a, b, c);
  const d4 = cross(a, b, d);
  return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) &&
         ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
}

function coinCenter(coin) {
  return { x: coin.x + coin.size / 2, y: coin.y + coin.size / 2 };
}

function isInsideCoin(px, py, coin) {
  const c = coinCenter(coin);
  return Math.hypot(px - c.x, py - c.y) <= (coin.size / 2 + 30);
}

// ═══════════════════════════════════════════
// 生成唔交叉排列
// ═══════════════════════════════════════════
function generateLayout(W, H) {
  // 6 個格位（相對座標 0-1）
  const SLOTS = [
    { x: 0.15, y: 0.20 },   // 左上
    { x: 0.85, y: 0.20 },   // 右上
    { x: 0.50, y: 0.50 },   // 中
    { x: 0.15, y: 0.80 },   // 左下
    { x: 0.85, y: 0.80 },   // 右下
    { x: 0.50, y: 0.15 },   // 上中
  ];

  const JITTER = 40;   // 每格隨機偏移 ±40px

  for (let attempt = 0; attempt < 300; attempt++) {
    // 1. 打亂格位順序
    const shuffled = [...SLOTS].sort(() => Math.random() - 0.5);

    // 2. 每個硬幣放到一個格位（加隨機偏移）
    const candidate = COINS.map((c, i) => {
      const slot = shuffled[i];
      const cx = slot.x * W;
      const cy = slot.y * H;
      const ox = (Math.random() - 0.5) * 2 * JITTER;
      const oy = (Math.random() - 0.5) * 2 * JITTER;
      return {
        ...c,
        size: COIN_SIZE,
        x: cx + ox - COIN_SIZE / 2,
        y: cy + oy - COIN_SIZE / 2,
        connectedFrom: false,
        connectedTo: false,
        el: null,
      };
    });

    // 3. 檢查正確順序連線唔交叉
    if (sequenceHasNoCrossing(candidate, CORRECT_SEQUENCE)) {
      return candidate;
    }
    // 唔 OK → 再試
  }

  console.warn("回退到 S 形");
  return fallbackLayout(W, H);
}
function sequenceHasNoCrossing(coins, sequence) {
  const lines = [];
  for (let i = 0; i < sequence.length - 1; i++) {
    const a = coins.find(c => c.id === sequence[i]);
    const b = coins.find(c => c.id === sequence[i + 1]);
    if (!a || !b) return false;
    lines.push({ a: coinCenter(a), b: coinCenter(b) });
  }

  for (let i = 0; i < lines.length; i++) {
    for (let j = i + 1; j < lines.length; j++) {
      if (j === i + 1) continue;
      if (segmentsIntersect(lines[i].a, lines[i].b, lines[j].a, lines[j].b)) {
        return false;
      }
    }
  }
  return true;
}

function fallbackLayout(W, H) {
  const slots = [
    { x: 0.18, y: 0.20 }, { x: 0.78, y: 0.20 },
    { x: 0.78, y: 0.50 }, { x: 0.18, y: 0.50 },
    { x: 0.18, y: 0.80 }, { x: 0.78, y: 0.80 },
  ];
  return COINS.map((c, i) => {
    const cx = slots[i].x * W;
    const cy = slots[i].y * H;
    const ox = (Math.random() - 0.5) * 30;
    const oy = (Math.random() - 0.5) * 30;
    return {
      ...c,
      size: COIN_SIZE,
      x: cx + ox - COIN_SIZE / 2,
      y: cy + oy - COIN_SIZE / 2,
      connectedFrom: false,
      connectedTo: false,
      el: null,
    };
  });
}

// ═══════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════
function init() {
  resizeSvg();

  const wrap = document.getElementById("game-wrap");
  const W = wrap.clientWidth;
  const H = wrap.clientHeight - FOOTER_H;

  state.coins = generateLayout(W, H);

  renderCoins();
  bindEvents();
  state.startTime = performance.now();
}

// ═══════════════════════════════════════════
// 硬幣 SVG
// ═══════════════════════════════════════════
function coinSvg(c) {
  const gid = "g-" + c.id + "-" + Math.random().toString(36).slice(2, 6);
  const sid = "s-" + c.id + "-" + Math.random().toString(36).slice(2, 6);
  const s = c.size;

  return `
    <svg viewBox="0 0 200 200" width="${s}" height="${s}"
         xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="${gid}" cx="35%" cy="30%" r="80%">
          <stop offset="0%"   stop-color="#FFFBE8" stop-opacity="0.95"/>
          <stop offset="25%"  stop-color="${c.c1}"/>
          <stop offset="70%"  stop-color="${c.c2}"/>
          <stop offset="100%" stop-color="${c.c3}"/>
        </radialGradient>
        <linearGradient id="${sid}" x1="20%" y1="10%" x2="80%" y2="90%">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.5"/>
          <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
        </linearGradient>
      </defs>

      <circle cx="100" cy="100" r="98" fill="${c.c3}" opacity="0.7"/>
      <circle cx="100" cy="100" r="94" fill="url(#${gid})"
              stroke="${c.c3}" stroke-width="2.5"/>
      <circle cx="100" cy="100" r="88" fill="none"
              stroke="${c.c3}" stroke-width="2"
              stroke-dasharray="2 3" opacity="0.7"/>
      <circle cx="100" cy="100" r="78" fill="none"
              stroke="${c.c2}" stroke-width="1.5" opacity="0.6"/>
      <circle cx="100" cy="100" r="74" fill="none"
              stroke="${c.c3}" stroke-width="0.8" opacity="0.5"/>
      <circle cx="100" cy="100" r="94" fill="url(#${sid})" opacity="0.8"/>

      <text x="100" y="118" text-anchor="middle"
            font-family="'Arial Black', 'Helvetica', sans-serif"
            font-size="54" font-weight="900"
            fill="${c.textColor}"
            stroke="${c.c3}"
            stroke-width="1"
            paint-order="stroke fill"
            style="letter-spacing: -2px;">${c.text}</text>

      <ellipse cx="66" cy="58" rx="26" ry="16"
               fill="#FFFFFF" opacity="0.55"
               transform="rotate(-25 66 58)"/>
      <ellipse cx="140" cy="150" rx="14" ry="8"
               fill="#FFFFFF" opacity="0.2"
               transform="rotate(-25 140 150)"/>
    </svg>
  `;
}

function renderCoins() {
  const wrap = document.getElementById("game-wrap");
  state.coins.forEach((c, idx) => {
    const el = document.createElement("div");
    el.className = "coin";
    el.style.left = c.x + "px";
    el.style.top = c.y + "px";
    el.style.width = c.size + "px";
    el.style.height = c.size + "px";
    el.style.animationDelay = (idx * 0.06) + "s";
    el.innerHTML = coinSvg(c);
    el.dataset.coinId = c.id;
    el.addEventListener("pointerdown", onCoinPointerDown);
    wrap.appendChild(el);
    c.el = el;
  });
}

// ═══════════════════════════════════════════
// 拖曳
// ═══════════════════════════════════════════
function canDragFrom(coin) { return !coin.connectedFrom; }
function canConnectTo(coin, from) { return !coin.connectedTo && coin !== from; }

function onCoinPointerDown(e) {
  e.preventDefault();
  const coinId = e.currentTarget.dataset.coinId;
  const coin = state.coins.find(c => c.id === coinId);
  if (!coin) return;
  if (!canDragFrom(coin)) return;

  coin.el.classList.add("dragging");
  state.dragging = coin;
  state.dragStart = { x: e.clientX, y: e.clientY, time: performance.now() };

  const a = coinCenter(coin);
  const layer = document.getElementById("lines-layer");

  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("x1", a.x);
  line.setAttribute("y1", a.y);
  line.setAttribute("x2", e.clientX);
  line.setAttribute("y2", e.clientY);
  line.setAttribute("stroke", "#7A1F1F");
  line.setAttribute("stroke-width", "10");
  line.setAttribute("stroke-linecap", "round");
  line.setAttribute("stroke-dasharray", "16 10");
  line.setAttribute("opacity", "0.9");
  line.id = "ghost-line";
  layer.appendChild(line);

  document.addEventListener("pointermove", onPointerMove);
  document.addEventListener("pointerup", onPointerUp);
}

function onPointerMove(e) {
  const line = document.getElementById("ghost-line");
  if (!line) return;
  line.setAttribute("x2", e.clientX);
  line.setAttribute("y2", e.clientY);

  state.coins.forEach((c) => {
    c.el.classList.remove("highlight");
    if (!canConnectTo(c, state.dragging)) return;
    if (isInsideCoin(e.clientX, e.clientY, c)) {
      c.el.classList.add("highlight");
    }
  });
}

function onPointerUp(e) {
  const from = state.dragging;
  if (!from) return;

  from.el.classList.remove("dragging");
  state.coins.forEach(c => c.el.classList.remove("highlight"));

  const ghost = document.getElementById("ghost-line");
  if (ghost) ghost.remove();

  const target = state.coins.find(c =>
    canConnectTo(c, from) && isInsideCoin(e.clientX, e.clientY, c)
  );

  if (target) {
    makeConnection(from, target, state.dragStart.time);
  }

  state.dragging = null;
  state.dragStart = null;

  document.removeEventListener("pointermove", onPointerMove);
  document.removeEventListener("pointerup", onPointerUp);
}

// ═══════════════════════════════════════════
// 連線（三層）
// ═══════════════════════════════════════════
function makeConnection(from, to, startTime) {
  const layer = document.getElementById("lines-layer");
  const a = coinCenter(from);
  const b = coinCenter(to);

  const now = performance.now();
  const timeTaken = (now - startTime) / 1000;

  const overlaps = findOverlaps(from.id, to.id);

  const SEGMENTS = 8;
  const JITTER = 3;
  const pts = [];
  for (let i = 0; i <= SEGMENTS; i++) {
    const t = i / SEGMENTS;
    let px = a.x + (b.x - a.x) * t;
    let py = a.y + (b.y - a.y) * t;
    if (i > 0 && i < SEGMENTS) {
      px += (Math.random() - 0.5) * 2 * JITTER;
      py += (Math.random() - 0.5) * 2 * JITTER;
    }
    pts.push([px, py]);
  }
  const d = "M " + pts.map(p => `${p[0]} ${p[1]}`).join(" L ");

  const mkPath = (color, width, opacity) => {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d);
    p.setAttribute("stroke", color);
    p.setAttribute("stroke-width", width);
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("stroke-linejoin", "round");
    p.setAttribute("fill", "none");
    p.setAttribute("opacity", opacity);
    layer.appendChild(p);
  };

  mkPath("#D4A017", 16, 0.25);
  mkPath("#5A1515", 12, 0.85);
  mkPath("#A83232", 7, 1);

  state.connections.push({
    from: from.id,
    to: to.id,
    time: timeTaken,
    overlaps: overlaps,
  });

  from.connectedFrom = true;
  to.connectedTo = true;
  from.el.classList.add("connected");
  to.el.classList.add("connected");

  updateUndoBtn();

  if (state.connections.length === TARGET_CONNECTIONS) {
    setTimeout(finishGame, 400);
  }
}

function findOverlaps(fromId, toId) {
  const overlaps = [];
  const fromCoin = state.coins.find(c => c.id === fromId);
  const toCoin   = state.coins.find(c => c.id === toId);
  if (!fromCoin || !toCoin) return overlaps;

  const a = coinCenter(fromCoin);
  const b = coinCenter(toCoin);

  state.connections.forEach((conn, idx) => {
    if (conn.from === fromId || conn.to === fromId) return;
    if (conn.from === toId || conn.to === toId) return;

    const cFrom = state.coins.find(c => c.id === conn.from);
    const cTo   = state.coins.find(c => c.id === conn.to);
    if (!cFrom || !cTo) return;

    const c = coinCenter(cFrom);
    const d = coinCenter(cTo);

    if (segmentsIntersect(a, b, c, d)) overlaps.push(idx);
  });

  return overlaps;
}

// ═══════════════════════════════════════════
// Undo
// ═══════════════════════════════════════════
function undo() {
  if (state.connections.length === 0) return;

  const last = state.connections.pop();

  const elapsed = (performance.now() - state.startTime) / 1000;
  state.undoEvents.push({
    at_sec: parseFloat(elapsed.toFixed(2)),
    connection_index: state.connections.length,
    removed: { from: last.from, to: last.to },
  });

  const layer = document.getElementById("lines-layer");
  for (let i = 0; i < 3; i++) {
    if (layer.lastChild) layer.removeChild(layer.lastChild);
  }

  const fromCoin = state.coins.find(c => c.id === last.from);
  const toCoin   = state.coins.find(c => c.id === last.to);

  const fromStillFrom = state.connections.some(c => c.from === last.from);
  const fromStillTo   = state.connections.some(c => c.to   === last.from);
  const toStillFrom   = state.connections.some(c => c.from === last.to);
  const toStillTo     = state.connections.some(c => c.to   === last.to);

  if (fromCoin) {
    fromCoin.connectedFrom = fromStillFrom;
    fromCoin.connectedTo   = fromStillTo;
    fromCoin.el.classList.toggle("connected", fromStillFrom || fromStillTo);
  }
  if (toCoin) {
    toCoin.connectedFrom = toStillFrom;
    toCoin.connectedTo   = toStillTo;
    toCoin.el.classList.toggle("connected", toStillFrom || toStillTo);
  }

  recalcAllOverlaps();
  state.undoCount++;
  updateUndoBtn();
}

function recalcAllOverlaps() {
  state.connections.forEach((conn) => {
    const saved = state.connections;
    state.connections = saved.filter(c => c !== conn);
    conn.overlaps = findOverlaps(conn.from, conn.to);
    state.connections = saved;
  });
}

function updateUndoBtn() {
  document.getElementById("undo-btn").disabled =
    state.connections.length === 0;
}

// ═══════════════════════════════════════════
// 完成
// ═══════════════════════════════════════════
function finishGame() {
  const totalTime = (performance.now() - state.startTime) / 1000;

  const playerSeq = buildSequence();
  const isCorrect = JSON.stringify(playerSeq) === JSON.stringify(CORRECT_SEQUENCE);
  const hasOverlap = state.connections.some(c => c.overlaps.length > 0);
  const meetsMoca = isCorrect && !hasOverlap;

  const result = {
    game_id: "connect_coins",
    completed: true,
    total_time_sec: parseFloat(totalTime.toFixed(2)),
    sequence: playerSeq,
    connections: state.connections.map(c => ({
      from: c.from,
      to: c.to,
      time_sec: parseFloat(c.time.toFixed(2)),
      overlaps_with: c.overlaps,
    })),
    undo_count: state.undoCount,
    undo_events: state.undoEvents,
    has_overlap: hasOverlap,
    is_correct: isCorrect,
    meets_moca_criteria: meetsMoca,
    correct_sequence: CORRECT_SEQUENCE,
  };

  console.log("=== 遊戲結果 ===");
  console.log(JSON.stringify(result, null, 2));

  document.getElementById("done-panel").classList.add("show");
}

function buildSequence() {
  if (state.connections.length === 0) return [];
  const seq = [state.connections[0].from];
  state.connections.forEach(c => seq.push(c.to));
  return seq;
}

// ═══════════════════════════════════════════
// 重新開始
// ═══════════════════════════════════════════
function restart() {
  document.querySelectorAll(".coin").forEach(el => el.remove());
  const layer = document.getElementById("lines-layer");
  if (layer) layer.innerHTML = "";

  state = {
    coins: [],
    connections: [],
    undoCount: 0,
    undoEvents: [],
    startTime: null,
    dragging: null,
    dragStart: null,
  };

  document.getElementById("done-panel").classList.remove("show");
  document.getElementById("undo-btn").disabled = true;
  init();
}

// ═══════════════════════════════════════════
// 綁定事件
// ═══════════════════════════════════════════
function bindEvents() {
  document.getElementById("undo-btn").addEventListener("click", undo);
  document.getElementById("restart-btn").addEventListener("click", restart);
  document.getElementById("close-done").addEventListener("click", () => {
    document.getElementById("done-panel").classList.remove("show");
  });
}

// ═══════════════════════════════════════════
// 啟動
// ═══════════════════════════════════════════
window.addEventListener("load", init);
window.addEventListener("resize", () => {
  resizeSvg();
  if (state.coins.length && state.connections.length === 0) {
    restart();
  }
});
</script>
