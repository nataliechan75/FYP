<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>街市接線遊戲</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif;
    background: #2A1810;
    color: #2B1A08;
    overflow: hidden;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    font-size: 16px;
  }

  #game-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
  }

  #bg {
    position: absolute;
    inset: 0;
    background-color: #F5E6C8;
    background-image:
      radial-gradient(circle at 15% 25%, rgba(122, 31, 31, 0.08) 0%, transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(212, 160, 23, 0.12) 0%, transparent 50%),
      repeating-linear-gradient(88deg,
        rgba(90, 40, 20, 0.04) 0 2px,
        transparent 2px 8px);
    pointer-events: none;
  }

  #canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .coin {
    position: absolute;
    cursor: grab;
    user-select: none;
    z-index: 10;
    touch-action: none;
    transition: transform 0.15s ease;
    filter: drop-shadow(0 3px 5px rgba(60, 30, 10, 0.4));
  }

  .coin.dragging {
    z-index: 100;
    transform: scale(1.15);
  }

  .coin.connected {
    filter: drop-shadow(0 0 12px rgba(212, 160, 23, 0.95))
            drop-shadow(0 3px 5px rgba(60, 30, 10, 0.4));
  }

  .coin.highlight {
    filter: drop-shadow(0 0 16px rgba(212, 160, 23, 1));
    transform: scale(1.1);
  }

  .coin svg {
    width: 100%; height: 100%;
    pointer-events: none;
    display: block;
  }

  #footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 14px 18px;
    background: linear-gradient(180deg,
      rgba(245, 230, 200, 0.94) 0%,
      rgba(232, 212, 168, 0.98) 100%);
    border-top: 3px solid #7A1F1F;
    box-shadow: 0 -2px 0 #D4A017;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 200;
  }

  #hint {
    font-size: 20px;
    font-weight: 700;
    color: #7A1F1F;
    width: 100%;
    text-align: center;
    line-height: 1.4;
  }

  #footer-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    font-family: inherit;
    font-size: 18px;
    font-weight: 900;
    padding: 12px 20px;
    border: 3px solid #5A1515;
    border-radius: 10px;
    background: linear-gradient(180deg, #A83232 0%, #7A1F1F 100%);
    color: #F5E6C8;
    cursor: pointer;
    min-width: 100px;
    box-shadow: 0 3px 0 #5A1515;
  }

  .btn:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #5A1515;
  }

  .btn:disabled {
    background: #C9B99A;
    border-color: #8A7A58;
    color: #6A5A40;
    cursor: not-allowed;
    box-shadow: 0 3px 0 #8A7A58;
  }

  .btn.secondary {
    background: linear-gradient(180deg, #F5E6C8 0%, #E8D4A8 100%);
    color: #7A1F1F;
    box-shadow: 0 3px 0 #7A1F1F;
  }

  #finish-popup {
    position: fixed;
    inset: 0;
    background: rgba(42,24,16,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999999;
    padding: 24px;
  }

  #finish-popup.show {
    display: flex !important;
  }

  #finish-card {
    background: linear-gradient(180deg, #F5E6C8, #E8D4A8);
    border: 6px solid #7A1F1F;
    border-radius: 24px;
    padding: 32px 40px;
    max-width: 450px;
    text-align: center;
    box-shadow: 0 0 0 8px #D4A017, 0 30px 80px rgba(0,0,0,0.6);
  }

  #finish-card h2 {
    font-size: 32px;
    color: #7A1F1F;
    margin-bottom: 12px;
  }

  #finish-card p {
    font-size: 22px;
    color: #5A4030;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div id="game-wrap">
  <div id="bg"></div>
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg"
       width="100%" height="100%">
    <g id="lines-layer"></g>
  </svg>
</div>

<div id="footer">
  <div id="hint">💡 1 元硬幣 → 10 元紙幣 → 2 元硬幣 → …… → 100 元紙幣</div>
  <div id="footer-buttons">
    <button class="btn secondary" id="undo-btn" disabled>↩️ 撤銷</button>
    <button class="btn" id="restart-btn">🔄 重新開始</button>
  </div>
</div>

<div id="finish-popup">
  <div id="finish-card">
    <h2>✅ 完成啦！</h2>
    <p>請拉向下撳<br>「➡️ 去下一關」</p>
  </div>
</div>

<script>
